; =============================================================================
;  PHP configuration for the vercel-php runtime (api/index.php is the lambda).
;  The runtime copies this file into the PHP server's config on each boot —
;  https://github.com/vercel-community/php
;
;  Defaults on Vercel are PHP's stock values (upload_max_filesize=2M), which
;  would reject doctor photos / CVs. Livewire also enforces its own 12MB cap
;  (config/livewire.php temporary_file_upload.rules), so keep these aligned.
; =============================================================================

upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
max_execution_time = 30
max_input_time = 60
