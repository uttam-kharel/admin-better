name: Deploy to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      # Skip (not fail) when the FTP secrets aren't configured yet.
      # Note: the `secrets` context is NOT available in `if` conditionals
      # (job- or step-level), so expose them as step env vars and test those.
      - name: Deploy to InfinityFree via FTP
        if: ${{ env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' }}
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/       # Use /htdocs/ for main domain
          # For addon domains, use: /yourdomain.com/htdocs/
          timeout: 86400000
          log-level: standard
          exclude: |
            - node_modules/
            - .git/
