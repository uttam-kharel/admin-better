name: CI — quality gates + database

# DEPLOYMENT IS DONE BY VERCEL'S OFFICIAL GIT INTEGRATION, not by this
# workflow. The repo is connected to the project in the Vercel dashboard
# (Project → Settings → Git), so Vercel itself deploys:
#   - push to main      → production deployment (sih-hospital.vercel.app)
#   - pull request      → preview deployment with its own .vercel.app URL
#
# This workflow only does the PHP-dependent work that Vercel's build image
# can't (no PHP there): build the frontend, enforce the JS bundle budget,
# compile Blade views, and apply migrations + seed to the Neon database.
# It needs no Vercel token — deployment is triggered natively by GitHub.

# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL_UNPOOLED = Neon's DIRECT (non-pooled) connection string.
#     Required: the pooled PgBouncer proxy rejects schema changes
#     ("current transaction is aborted") — migrations NEVER work pooled.
#   DATABASE_URL          = optional fallback if UNPOOLED is missing.
#   APP_KEY               = same key as production; if unset, CI generates
#                           a throwaway one (fine for migrate/seed only).
#   (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are no longer needed —
#    deployment is handled by the Git integration.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies (needed by Vite to resolve vendor assets)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # Performance budget: the public JS bundle must stay lean. Chart.js lives in
      # the admin-only entry, so the public app-*.js should be well under 350KB.
      - name: Enforce JS bundle budget
        run: |
          size=$(du -k public/build/assets/app-*.js | awk '{s+=$1} END {print s}')
          echo "Public JS bundle: ${size}KB (budget 350KB)"
          if [ "$size" -gt 350 ]; then
            echo "::error::Public JS bundle ${size}KB exceeds the 350KB budget — keep Chart.js and other heavy deps out of the public entry."
            exit 1
          fi

      # Apply schema + seed content on the Neon Postgres database. Runs ONLY
      # when the DATABASE_URL_UNPOOLED secret exists (skips otherwise).
      # NOTE: the secret is referenced in env (not in an if: condition) —
      # referencing an unset secret in if: fails GitHub's workflow validation.
      - name: Migrate + seed Neon database
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: pgsql
        run: |
          DB_URL="${DATABASE_URL_UNPOOLED:-$DATABASE_URL}"
          if [ -z "$DB_URL" ]; then
            echo "DATABASE_URL_UNPOOLED secret not set — skipping Neon migrate/seed."
            exit 0
          fi
          cp .env.example .env
          if [ -n "$APP_KEY" ]; then
            sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env
            echo "Using APP_KEY from GitHub secret."
          else
            php artisan key:generate --force
          fi
          DATABASE_URL="$DB_URL" php artisan migrate --force
          # Seeds ONLY when the database is empty — safe on an existing live DB
          # (seeders insert with explicit IDs, so re-seeding would crash/duplicate).
          DATABASE_URL="$DB_URL" php artisan db:seed-if-empty --force

      # Compile all Blade templates once at deploy time: faster cold starts and a
      # build-time check that no view is broken. (Deliberately NOT config/route
      # caching — config:cache bakes build-time env and route:cache bakes the
      # APP_KEY-derived Livewire update URL, both of which differ on Vercel.)
      - name: Compile Blade views
        run: php artisan view:cache
