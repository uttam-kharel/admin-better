name: Deploy to Vercel

# CI/CD for the livewire-app (Laravel + Livewire on Vercel).
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        – Vercel API token (from https://vercel.com/account/tokens)
#   VERCEL_ORG_ID       – team_...  (see .vercel/project.json → "orgId")
#   VERCEL_PROJECT_ID   – prj_...   (see .vercel/project.json → "projectId")
#
# Uses the DIRECT vercel deploy command (not the pull/build/prebuilt pipeline),
# because this project uses the vercel-php custom runtime — the direct command
# is the proven path for this setup (see .vercelignore note about Composer).
#
# Behavior:
#   - push to main            → production deploy (aliased to v1.sih.com.np)
#   - pull request            → preview deploy with a unique .vercel.app URL + PR comment
#   - workflow_dispatch       → manual production re-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ── Preview deploy (pull requests) ─────────────────────────────
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies (needed by Vite to resolve vendor assets)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy preview to Vercel
        id: deploy
        run: |
          url="$(npx vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"

      - name: Comment preview URL on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            if (!url) return;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployment ready:** ${url}`,
            });

  # ── Production deploy (push to main / manual) ──────────────────
  production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies (needed by Vite to resolve vendor assets)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # Performance budget: the public JS bundle must stay lean. Chart.js lives in
      # the admin-only entry, so the public app-*.js should be well under 350KB.
      - name: Enforce JS bundle budget
        run: |
          size=$(du -k public/build/assets/app-*.js | awk '{s+=$1} END {print s}')
          echo "Public JS bundle: ${size}KB (budget 350KB)"
          if [ "$size" -gt 350 ]; then
            echo "::error::Public JS bundle ${size}KB exceeds the 350KB budget — keep Chart.js and other heavy deps out of the public entry."
            exit 1
          fi

      # Apply schema + seed content on the Neon Postgres database. Runs ONLY
      # when the DATABASE_URL_UNPOOLED secret exists (skips otherwise).
      # NOTE: the secret is referenced in env (not in an if: condition) —
      # referencing an unset secret in if: fails GitHub's workflow validation.
      # Add the secret in: GitHub repo → Settings → Secrets → Actions.
      #   DATABASE_URL_UNPOOLED = Neon's DIRECT (non-pooled) connection string.
      #     Required: the pooled PgBouncer proxy rejects schema changes
      #     ("current transaction is aborted") — migrations NEVER work pooled.
      #   DATABASE_URL          = optional fallback if UNPOOLED is missing.
      #   APP_KEY               = same key as production; if unset, CI generates
      #                           a throwaway one (fine for migrate/seed only).
      - name: Migrate + seed Neon database
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: pgsql
        run: |
          DB_URL="${DATABASE_URL_UNPOOLED:-$DATABASE_URL}"
          if [ -z "$DB_URL" ]; then
            echo "DATABASE_URL_UNPOOLED secret not set — skipping Neon migrate/seed."
            exit 0
          fi
          cp .env.example .env
          if [ -n "$APP_KEY" ]; then
            sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env
            echo "Using APP_KEY from GitHub secret."
          else
            php artisan key:generate --force
          fi
          DATABASE_URL="$DB_URL" php artisan migrate --force
          # Seeds ONLY when the database is empty — safe on an existing live DB
          # (seeders insert with explicit IDs, so re-seeding would crash/duplicate).
          DATABASE_URL="$DB_URL" php artisan db:seed-if-empty --force

      # Compile all Blade templates once at deploy time: faster cold starts and a
      # build-time check that no view is broken. (Deliberately NOT config/route
      # caching — config:cache bakes build-time env and route:cache bakes the
      # APP_KEY-derived Livewire update URL, both of which differ on Vercel.)
      - name: Compile Blade views
        run: php artisan view:cache

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy production to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      # Best-effort cache warm-up so the first real visitor doesn't pay the
      # cold-cache cost (database cache is populated by these requests).
      - name: Warm production caches
        continue-on-error: true
        run: |
          for p in "/" "/services" "/departments" "/doctors"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://sih-hospital.vercel.app$p" || true)
            echo "warm $p -> $code"
          done
