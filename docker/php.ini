; =============================================================================
;  PHP INI overrides for the Vercel container deployment (FrankenPHP alpine).
;  Copied to /usr/local/etc/php/conf.d/zz-app.ini in Dockerfile.vercel.
;  Kept aligned with api/php.ini (the old vercel-php serverless runtime).
; =============================================================================

upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
max_execution_time = 30
max_input_time = 60

; The image is immutable on Vercel (code never changes at runtime), so
; timestamp validation can be off for maximum performance.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
